name: main

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checkov:
    name: Checkov - ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: terraform
            directory: infra
            framework: terraform

          - name: ansible
            directory: ansible
            framework: ansible

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: ${{ matrix.directory }}
          framework: ${{ matrix.framework }}
          quiet: true
          output_format: junitxml
          output_file_path: checkov-${{ matrix.name }}.xml

      - name: Upload Checkov report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checkov-${{ matrix.name }}-results
          path: checkov-${{ matrix.name }}.xml
          if-no-files-found: warn

  shellcheck:
    name: ShellCheck - Bash
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check Bash scripts
        shell: bash
        run: |
          cp example.env .env
          shellcheck --external-sources deploy.sh scripts/*.sh

  powershell:
    name: PSScriptAnalyzer - PowerShell
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer `
            -Scope CurrentUser `
            -Force `
            -Repository PSGallery

      - name: Analyze PowerShell scripts
        shell: pwsh
        run: |
          $scripts = @(
            Get-Item .\deploy.ps1
            Get-ChildItem .\scripts -Filter *.ps1 -Recurse
          )

          $issues = @(
            foreach ($script in $scripts) {
              Invoke-ScriptAnalyzer `
                -Path $script.FullName `
                -Severity Error,Warning
            }
          )

          if ($issues.Count -gt 0) {
            $issues | Format-Table -AutoSize | Out-String | Write-Host
            throw "PSScriptAnalyzer found $($issues.Count) issues."
          }

  python:
    name: Python - Ruff and Bandit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analysis tools
        run: python -m pip install ruff bandit

      - name: Run Ruff
        run: ruff check main.py utils/ config/

      - name: Run Bandit
        if: ${{ !cancelled() }}
        run: bandit -r main.py utils/ config/

